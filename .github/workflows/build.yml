name: build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore NextMinecraftLauncher.sln

      - name: Build
        run: dotnet build NextMinecraftLauncher.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test NextMinecraftLauncher.sln --configuration Release --no-build --verbosity normal
